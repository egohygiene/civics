name: Deploy Civics

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build static civic portal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind Repository Intelligence source and evaluation clock
        id: intelligence_context
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse --verify HEAD)"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          as_of="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          verified_epoch="$(date -u --date="$as_of" +%s)"
          printf 'source-commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"
          printf 'as-of=%s\n' "$as_of" >> "$GITHUB_OUTPUT"
          printf 'verified-epoch=%s\n' "$verified_epoch" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate civic data
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f data/raw/manifest.json ]]; then
            node scripts/validate-civic-data.mjs
          else
            echo "Raw API snapshots have not been bootstrapped; validating the reviewed seed only."
          fi

      - name: Validate campaign finance data
        run: node scripts/validate-ocpf-finance.mjs

      - name: Validate candidate portrait publication gates
        run: node scripts/validate-portraits.mjs

      - name: Run tests
        run: npm test

      - name: Build portal
        run: npm run build

      - name: Capture civic portal routes and assets before composition
        uses: egohygiene/relay/actions/repository-intelligence-deployment-provenance@5d27be5ce1599df883e31f14cd894eb18622c18c
        with:
          operation: capture-baseline
          consumer-repository: egohygiene/civics
          consumer-revision: ${{ steps.intelligence_context.outputs.source-commit }}
          site-directory: dist
          intelligence-directory: dist/intelligence
          evidence-directory: .cache/intelligence-composition

      - name: Normalize explicitly selected public review evidence
        id: intelligence_reviews
        uses: egohygiene/relay/actions/repository-intelligence-review-feed@5d27be5ce1599df883e31f14cd894eb18622c18c
        with:
          source-root: .
          plan: .github/intelligence-review-plan.json
          repository: egohygiene/civics
          represented-commit: ${{ steps.intelligence_context.outputs.source-commit }}
          as-of: ${{ steps.intelligence_context.outputs.as-of }}
          output-directory: .cache/intelligence-review-feed

      - name: Build shared Repository Intelligence subtree
        id: intelligence
        uses: egohygiene/relay/actions/repository-intelligence@5d27be5ce1599df883e31f14cd894eb18622c18c
        with:
          repository: egohygiene/civics
          repository-visibility: public
          source-commit: ${{ steps.intelligence_context.outputs.source-commit }}
          as-of: ${{ steps.intelligence_context.outputs.as-of }}
          output-directory: dist/intelligence
          work-directory: .cache/repository-intelligence
          observatory-audits: ${{ steps.intelligence_reviews.outputs.repository-audits }}
          observatory-sanity: ${{ steps.intelligence_reviews.outputs.repository-sanity }}
          collect-adrs: "false"
          collect-roadmap: "false"
          collect-dependencies: "false"
          collect-journey: "false"
          require-full-history: "true"

      - name: Verify Intelligence composition and preserve civic portal bytes
        id: intelligence_composition
        uses: egohygiene/relay/actions/repository-intelligence-deployment-provenance@5d27be5ce1599df883e31f14cd894eb18622c18c
        with:
          operation: verify-composition
          consumer-repository: egohygiene/civics
          consumer-revision: ${{ steps.intelligence_context.outputs.source-commit }}
          relay-revision: 5d27be5ce1599df883e31f14cd894eb18622c18c
          verified-epoch: ${{ steps.intelligence_context.outputs.verified-epoch }}
          site-directory: dist
          intelligence-directory: dist/intelligence
          evidence-directory: .cache/intelligence-composition
          required-routes: >-
            ["/","/intelligence/","/intelligence/audits/","/intelligence/sanity/"]
          aliases: "[]"

      - name: Retain typed review and composition evidence separately from Pages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: civics-intelligence-review-${{ steps.intelligence_context.outputs.source-commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.intelligence_reviews.outputs.artifact-directory }}
            .cache/intelligence-composition/consumer-route-baseline.json
            .cache/intelligence-composition/composition-verification.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
